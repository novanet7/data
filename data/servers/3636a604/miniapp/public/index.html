<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Katalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F1A;
    --surface:#141A2A;
    --surface-2:#1B2233;
    --border:#262E44;
    --text:#EDEFF7;
    --muted:#8892B0;
    --lime:#B4FF39;
    --cyan:#39D8FF;
    --danger:#FF6B6B;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Inter',sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Header ---------- */
  .hero{
    position:relative;
    padding:20px 18px 22px;
    overflow:hidden;
    border-bottom:1px solid var(--border);
    background:
      radial-gradient(120% 100% at 0% 0%, rgba(180,255,57,0.08), transparent 55%),
      radial-gradient(120% 100% at 100% 0%, rgba(57,216,255,0.08), transparent 55%);
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    opacity:0.5;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--lime);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--lime);
    box-shadow:0 0 8px var(--lime);
    animation:blink 1.8s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .hero h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .hero p{
    margin:0;
    font-size:13.5px;
    color:var(--muted);
  }

  /* ---------- Tabs ---------- */
  .tabs{
    position:sticky; top:0; z-index:5;
    display:flex; gap:8px;
    padding:12px 18px;
    background:rgba(11,15,26,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--muted);
    white-space:nowrap;
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab[aria-selected="true"]{
    background:var(--lime);
    color:#0B0F1A;
    border-color:var(--lime);
  }

  /* ---------- List ---------- */
  .list{ padding:14px 18px 28px; display:flex; flex-direction:column; gap:10px; }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .card:active{ transform:scale(0.98); }
  .card:hover{ border-color:#38425e; }
  .card-main{ min-width:0; }
  .card-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-desc{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-right{ text-align:right; flex-shrink:0; }
  .price{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:600;
    color:var(--lime);
    white-space:nowrap;
  }
  .stock{
    display:block;
    margin-top:4px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
  }
  .stock.out{ color:var(--danger); }

  .empty, .error, .loading{
    padding:40px 18px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }
  .loading .spinner{
    width:22px; height:22px;
    border:2px solid var(--border);
    border-top-color:var(--lime);
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Detail sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:10;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--surface-2);
    border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.2,.9,.25,1);
    z-index:11;
    max-height:80vh;
    overflow-y:auto;
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px; border-radius:2px;
    background:var(--border);
    margin:0 auto 16px;
  }
  .sheet h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    margin:0 0 8px;
  }
  .sheet .price-tag{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:600;
    color:var(--lime);
    background:rgba(180,255,57,0.08);
    border:1px solid rgba(180,255,57,0.25);
    padding:5px 12px;
    border-radius:8px;
    margin-bottom:14px;
  }
  .sheet .desc{
    font-size:13.5px;
    line-height:1.6;
    color:#C7CCDC;
    margin:0 0 20px;
    white-space:pre-wrap;
  }
  .buy-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--lime);
    color:#0B0F1A;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:filter .15s ease;
  }
  .buy-btn:active{ filter:brightness(0.9); }
  .buy-btn:disabled{
    background:var(--surface);
    color:var(--muted);
    border:1px solid var(--border);
  }
  .close-btn{
    position:absolute; top:16px; right:16px;
    width:28px; height:28px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--muted);
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="eyebrow"><span class="dot"></span><span id="statusLabel">terhubung</span></div>
    <h1 id="botNameHeading">Katalog</h1>
    <p>Pilih produk, ketuk untuk lihat detail, lalu beli langsung dari chat bot.</p>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="list" id="list">
    <div class="loading"><div class="spinner"></div>Memuat katalog…</div>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <button class="close-btn" id="closeSheet">✕</button>
    <div class="sheet-handle"></div>
    <h2 id="sheetName">-</h2>
    <div class="price-tag" id="sheetPrice">-</div>
    <p class="desc" id="sheetDesc">-</p>
    <button class="buy-btn" id="buyBtn">Beli Sekarang</button>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setBackgroundColor("#0B0F1A"); } catch(e) {}
    try { tg.setHeaderColor("#0B0F1A"); } catch(e) {}
  }

  const state = { catalog: null, activeTab: null, selected: null, botUsername: "" };

  const listEl = document.getElementById("list");
  const tabsEl = document.getElementById("tabs");
  const sheetEl = document.getElementById("sheet");
  const backdropEl = document.getElementById("backdrop");

  function formatRupiah(n){
    return "Rp " + Number(n || 0).toLocaleString("id-ID");
  }

  function openSheet(item){
    state.selected = item;
    document.getElementById("sheetName").textContent = item.nama;
    document.getElementById("sheetPrice").textContent = "[ " + formatRupiah(item.harga) + " ]";
    document.getElementById("sheetDesc").textContent = item.deskripsi || "Tidak ada deskripsi tambahan.";

    const buyBtn = document.getElementById("buyBtn");
    const habis = item.stok !== null && item.stok <= 0;
    buyBtn.disabled = habis;
    buyBtn.textContent = habis ? "Stok Habis" : "Beli Sekarang";

    sheetEl.classList.add("open");
    backdropEl.classList.add("open");
  }

  function closeSheet(){
    sheetEl.classList.remove("open");
    backdropEl.classList.remove("open");
    state.selected = null;
  }

  document.getElementById("closeSheet").onclick = closeSheet;
  backdropEl.onclick = closeSheet;

  document.getElementById("buyBtn").onclick = () => {
    const item = state.selected;
    if (!item || !state.botUsername) return;
    const payload = `buy${item.kind}_${item.idx}`;
    const link = `https://t.me/${state.botUsername}?start=${payload}`;
    if (tg) {
      tg.openTelegramLink(link);
      tg.close();
    } else {
      window.open(link, "_blank");
    }
  };

  function renderTabs(){
    tabsEl.innerHTML = "";
    state.catalog.categories.forEach(cat => {
      const btn = document.createElement("div");
      btn.className = "tab";
      btn.textContent = `${cat.label} (${cat.items.length})`;
      btn.setAttribute("aria-selected", cat.key === state.activeTab ? "true" : "false");
      btn.onclick = () => { state.activeTab = cat.key; renderTabs(); renderList(); };
      tabsEl.appendChild(btn);
    });
  }

  function renderList(){
    const cat = state.catalog.categories.find(c => c.key === state.activeTab);
    listEl.innerHTML = "";

    if (!cat || cat.items.length === 0) {
      listEl.innerHTML = `<div class="empty">Belum ada produk di kategori ini. Cek kategori lain atau tanya owner langsung di chat.</div>`;
      return;
    }

    cat.items.forEach(item => {
      const habis = item.stok !== null && item.stok <= 0;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-main">
          <p class="card-name">${escapeHtml(item.nama)}</p>
          <p class="card-desc">${escapeHtml(item.deskripsi || "Tanpa deskripsi")}</p>
        </div>
        <div class="card-right">
          <span class="price">${formatRupiah(item.harga)}</span>
          ${item.stok !== null ? `<span class="stock ${habis ? "out" : ""}">${habis ? "habis" : item.stok + " stok"}</span>` : ""}
        </div>
      `;
      card.onclick = () => openSheet(item);
      listEl.appendChild(card);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  async function init(){
    try {
      const res = await fetch("/api/catalog");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      state.catalog = data;
      state.botUsername = data.botUsername || "";
      state.activeTab = data.categories[0]?.key;
      document.getElementById("botNameHeading").textContent = data.botName || "Katalog";

      if (!state.botUsername) {
        document.getElementById("statusLabel").textContent = "belum dikonfigurasi";
      }

      renderTabs();
      renderList();
    } catch (err) {
      listEl.innerHTML = `<div class="error">Gagal memuat katalog (${err.message}). Tarik layar ke bawah untuk coba lagi, atau buka lewat menu bot biasa.</div>`;
    }
  }

  init();
</script>
</body>
</html>
