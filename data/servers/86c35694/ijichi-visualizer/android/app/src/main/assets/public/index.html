<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Ijichi Visualizer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="logo">🎛️</div>
    <div>
      <h1>Ijichi Visualizer</h1>
      <p class="tagline">// Render video visualizer langsung dari HP-mu</p>
    </div>
  </header>

  <main>

    <!-- PREVIEW -->
    <section class="card preview-card">
      <canvas id="previewCanvas" width="720" height="720"></canvas>
      <div class="preview-overlay-info">
        <strong id="pvArtist">Dimas 4Rack</strong>
        <span id="pvTitle">Hakikat Sebuah Cinta Remix [PLAT JMK]</span>
        <small id="pvTime">00:00</small>
      </div>
    </section>

    <!-- TEKS OVERLAY -->
    <section class="card">
      <h2 class="section-label">Teks Overlay</h2>

      <label>Nama Artis</label>
      <input id="artistName" type="text" placeholder="Dimas 4Rack" value="Dimas 4Rack" />

      <label>Judul Lagu</label>
      <input id="songTitle" type="text" placeholder="Judul lagu" value="Hakikat Sebuah Cinta Remix [PLAT JMK]" />

      <label>Watermark (pojok kanan bawah, opsional)</label>
      <input id="watermark" type="text" placeholder="D4R" />
    </section>

    <!-- ASSET -->
    <section class="card">
      <h2 class="section-label">Asset</h2>

      <label>1. Background (gambar)</label>
      <label class="filebox" for="bgFile"><span id="bgFileName">Pilih gambar…</span></label>
      <input id="bgFile" type="file" accept="image/*" hidden />

      <label>2. Audio (lagu)</label>
      <label class="filebox" for="audioFile"><span id="audioFileName">Pilih audio…</span></label>
      <input id="audioFile" type="file" accept="audio/*" hidden />

      <div class="row2">
        <div>
          <label>3. Resolusi Export</label>
          <select id="resSelect">
            <option value="480">480p (854×480)</option>
            <option value="720" selected>720p (1280×720)</option>
            <option value="1080">1080p (1920×1080)</option>
          </select>
        </div>
        <div>
          <label>4. FPS</label>
          <select id="fpsSelect">
            <option value="24">24 fps</option>
            <option value="30" selected>30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </div>
      </div>

      <label>5. Kekuatan Ayun (sway)</label>
      <select id="swayIntensity">
        <option value="soft">Halus (rekomendasi)</option>
        <option value="medium">Sedang</option>
      </select>
    </section>

    <!-- EXPORT -->
    <section class="card">
      <button id="exportBtn" class="export-btn">Export ke .mp4</button>
      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        <p id="progressLabel">Menyiapkan…</p>
      </div>
      <p id="resultPath" class="result-path hidden"></p>
    </section>

  </main>

  <!-- Bridge Capacitor native disuntik otomatis oleh runtime Android, tidak perlu file ini ada di www/.
       Script Filesystem plugin di bawah WAJIB di-vendor lokal (lihat README) supaya jalan tanpa internet. -->
  <script src="vendor/capacitor-filesystem.js"></script>
  <script src="app.js"></script>
</body>
</html>
